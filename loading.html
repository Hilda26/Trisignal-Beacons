<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tri-Signal | Loading State</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f1efe9;--paper:#fbfaf7;--ink:#151515;--muted:#77736c;--line:#d6d0c7;--soft:#e8e4dc}
body.dark{--bg:#0f0f12;--paper:#17171b;--ink:#f5f3ef;--muted:#9b9790;--line:#2d2d34;--soft:#24242a}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{min-height:100vh;display:grid;grid-template-rows:64px 1fr}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{font:900 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.1em}
.actions{display:flex;gap:8px}
button,a{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:9px 11px;border-radius:999px;font:800 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;text-decoration:none;cursor:pointer}
.main{position:relative;padding:28px clamp(14px,4vw,50px)}
.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}
.heading small{display:block;font:800 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.heading h1{font-size:34px;letter-spacing:-.05em;margin:0}
.state{font:800 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.workspace{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.channel{min-height:250px;border:1px solid var(--line);background:var(--paper);border-radius:15px;padding:16px}
.channel b{font:900 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.07em}
.signal-card{margin-top:18px;border-top:1px solid var(--line);padding-top:18px}
.skel{background:var(--soft);height:9px;border-radius:99px;margin-bottom:10px}.w80{width:80%}.w58{width:58%}.w42{width:42%}.block{height:74px;border-radius:11px;margin-top:18px}
.loading-layer{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 61%,transparent);backdrop-filter:blur(1.2px);display:grid;place-items:center}
.focus{width:150px;height:150px;border-radius:50%;background:color-mix(in srgb,var(--paper) 95%,transparent);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 20px 60px rgba(0,0,0,.08);position:relative}
.focus object{width:74px;height:74px}
body.dark .focus object{filter:invert(1)}
.focus:before,.focus:after{content:"";position:absolute;width:48px;height:1px;background:var(--muted);opacity:.42;top:50%}
.focus:before{right:100%}.focus:after{left:100%}
@media(max-width:760px){.top{padding:0 12px}.main{padding:20px 12px}.workspace{grid-template-columns:1fr}.channel:nth-child(n+2){display:none}.focus{width:122px;height:122px}.focus object{width:62px;height:62px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand">GenLayer / Decision Intake</div>
  <div class="actions"><a href="index.html">Signal Chamber</a><button id="theme">Theme</button></div>
</header>

<main class="main">
  <div class="heading">
    <div><small>Live loading-state demo</small><h1>Resolving incoming signals</h1></div>
    <div class="state">3 channels pending</div>
  </div>

  <section class="workspace" aria-hidden="true">
    <article class="channel"><b>Left intake</b><div class="signal-card"><div class="skel w80"></div><div class="skel w58"></div><div class="skel block"></div></div></article>
    <article class="channel"><b>Top intake</b><div class="signal-card"><div class="skel w58"></div><div class="skel w80"></div><div class="skel block"></div></div></article>
    <article class="channel"><b>Right intake</b><div class="signal-card"><div class="skel w80"></div><div class="skel w42"></div><div class="skel block"></div></div></article>
  </section>

  <div class="loading-layer" role="status" aria-label="Resolving three incoming signals">
    <div class="focus">
      <object data="tri-signal.svg" type="image/svg+xml" aria-label="Tri-Signal loading spinner"></object>
    </div>
  </div>
</main>
</div>
<script>document.getElementById("theme").onclick=()=>document.body.classList.toggle("dark")</script>
</body>
</html>
