<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 400 400"
     role="img"
     aria-label="GenLayer Tri-Signal loading spinner"
     class="genlayer-spinner">
  <style>
    .genlayer-spinner {
      width: 100%;
      height: 100%;
      overflow: visible;
      color: currentColor;
    }

    .gl-mark {
      fill: currentColor;
    }

    .gl-core {
      transform-box: view-box;
      transform-origin: 200.33px 247.84px;
      animation: gl-core-confirm 1.44s cubic-bezier(.45,0,.55,1) infinite;
      will-change: transform, opacity;
    }

    .gl-signal {
      fill: none;
      stroke: #000;
      stroke-width: 15;
      stroke-linecap: round;
      stroke-dasharray: 24 220;
      opacity: .95;
    }

    .gl-signal-a { animation: gl-a 1.44s linear infinite; }
    .gl-signal-b { animation: gl-b 1.44s linear infinite; }
    .gl-signal-c { animation: gl-c 1.44s linear infinite; }

    @keyframes gl-a {
      0%   { stroke-dashoffset: 250; opacity: 0; }
      5%   { opacity: .95; }
      26%  { stroke-dashoffset: 12; opacity: .95; }
      31%,100% { stroke-dashoffset: 12; opacity: 0; }
    }

    @keyframes gl-b {
      0%,24% { stroke-dashoffset: 250; opacity: 0; }
      29%    { opacity: .95; }
      50%    { stroke-dashoffset: 12; opacity: .95; }
      55%,100% { stroke-dashoffset: 12; opacity: 0; }
    }

    @keyframes gl-c {
      0%,48% { stroke-dashoffset: 250; opacity: 0; }
      53%    { opacity: .95; }
      74%    { stroke-dashoffset: 12; opacity: .95; }
      79%,100% { stroke-dashoffset: 12; opacity: 0; }
    }

    @keyframes gl-core-confirm {
      0%,72%,100% { transform: scale(1); opacity: 1; }
      82% { transform: scale(1.13); opacity: 1; }
      90% { transform: scale(.97); opacity: .92; }
    }

    @media (prefers-reduced-motion: reduce) {
      .gl-signal { animation: none !important; opacity: 0; }
      .gl-core { animation: gl-reduced 1.8s ease-in-out infinite; }
      @keyframes gl-reduced {
        0%,100% { opacity: .78; }
        50% { opacity: 1; }
      }
    }
  </style>

  <defs>
    <!-- White reveals the logo; black moving strokes cut through it.
         Because the signal is transparency, it works on both light and dark backgrounds. -->
    <mask id="tri-signal-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
      <rect width="400" height="400" fill="white"/>

      <!-- Left lower tip -> center -->
      <path class="gl-signal gl-signal-a"
            pathLength="250"
            d="M 31 361 C 82 338, 128 317, 171 299 C 184 293, 193 286, 200 279"/>

      <!-- Right lower tip -> center -->
      <path class="gl-signal gl-signal-b"
            pathLength="250"
            d="M 369 361 C 319 337, 274 317, 229 299 C 216 293, 207 286, 200 279"/>

      <!-- Top split -> center -->
      <path class="gl-signal gl-signal-c"
            pathLength="250"
            d="M 201 45 C 201 90, 201 132, 201 170 C 201 202, 200 233, 200 258"/>
    </mask>
  </defs>

  <g mask="url(#tri-signal-mask)">
    <polygon class="gl-mark"
      points="183,33 20,372 179,310 122,279 183,152"/>
    <polygon class="gl-mark"
      points="218,33 218,151 280,281 222,310 382,373"/>
    <polygon class="gl-mark gl-core"
      points="200,195 166,265 200,283 235,266"/>
  </g>
</svg>
